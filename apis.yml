name: Hireguide
description: >-
  Hireguide is a structured-interviewing and hiring-intelligence platform, originally
  a Techstars-backed startup, that helped talent teams run consistent, evidence-based
  interviews with guided question banks, scorecards, interview recording and AI-assisted
  candidate evaluation grounded in industrial-organizational hiring science. Hireguide's
  team and technology were acquired by HireVue in 2026; the primary domain now
  redirects to HireVue's AI Interviewer platform, while trust.hireguide.com remains
  live and Hireguide-branded, publishing the company's compliance posture (SOC 2 Type 2,
  GDPR, CCPA, EU AI Act, NIST AI RMF). This profile was added to the API Evangelist
  network as a Techstars portfolio lead; no independent public developer/API surface
  was found for Hireguide.
